# ─────────────────────────────────────────────────────────────────────────────
# Gateway connectivity check — intra-cluster · Node.js APM (classic NR agent)
#
# For the **intra-cluster** pattern: the app pod runs in the same cluster as
# the gateway and reaches it via the in-cluster reverse-proxy Service DNS name.
# For the **out-of-cluster** pattern, use the sibling manifest
# `sample-app-apm-nodejs-out-of-cluster.yaml` — it targets the apps-cluster
# via the private Route53 hostname + the `default` namespace where the
# out-of-cluster-tls module writes the CA bundle.
#
# Deploys a tiny instrumented Express app that continuously reports to the gateway via
# the standard `newrelic` npm agent — the same protocol/agent your existing
# Node.js services already use. Use this after applying the gateway modules to
# confirm the in-cluster path works before pointing real applications at it:
#
#   app pod --(TLS, 443)--> NGINX/Kong Service (in-cluster) --> the gateway --> New Relic
#
# What this does NOT need that a public NR install normally requires:
#   - No public internet route — everything happens over the cluster's internal
#     Service DNS.
#   - No manual TLS handling in the app — the CA bundle Secret created by the
#     cert-manager module (pcg_certificate) is mounted and trusted directly.
#
# ── Prerequisites ─────────────────────────────────────────────────────────────
#   - The gateway + NGINX (or Kong) already applied (aws/4-dns-tls/cert-manager,
#     aws/5-pcg/{flux,fluxless}, aws/3-ingress/reverse-proxy-within-cluster/*)
#   - `pcg-ca-bundle` Secret exists in the `newrelic` namespace
#   - Your New Relic ingest license key
#
# ── Usage ──────────────────────────────────────────────────────────────────────
#   kubectl -n newrelic create secret generic pcg-connectivity-nodejs-license \
#     --from-literal=license-key='<YOUR_INGEST_LICENSE_KEY>'
#   kubectl apply -f sample-app-apm-nodejs-intra-cluster.yaml
#
#   # If you're on Kong instead of NGINX, override the host before applying:
#   #   sed 's/pcg-nginx\./pcg-kong-kong-proxy./' sample-app-apm-nodejs-intra-cluster.yaml | kubectl apply -f -
#
# ── Verify ─────────────────────────────────────────────────────────────────────
#   kubectl -n newrelic logs -l app.kubernetes.io/name=pcg-connectivity-nodejs-apm
#   # Look for: "Agent state changed from connecting to connected"
#   # Then check New Relic: APM & Services -> pcg-connectivity-nodejs-apm
#
# ── Cleanup ────────────────────────────────────────────────────────────────────
#   kubectl delete -f sample-app-apm-nodejs-intra-cluster.yaml
#   kubectl -n newrelic delete secret pcg-connectivity-nodejs-license
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: pcg-connectivity-nodejs-apm-src
  namespace: newrelic
data:
  server.js: |
    const express = require('express');
    const http = require('http');
    const app = express();
    const PORT = 8080;

    app.get('/', (req, res) => res.send('pcg-connectivity-nodejs-apm ok\n'));
    app.get('/work', (req, res) => {
      // Small delay so the transaction has a measurable duration / span.
      setTimeout(() => res.json({ ok: true, ts: Date.now() }), 20);
    });

    app.listen(PORT, () => console.log('pcg-connectivity-nodejs-apm listening on', PORT));

    // Generate steady self-traffic so APM reports Transactions + Spans
    // continuously without needing an external caller.
    setInterval(() => {
      http.get(`http://localhost:${PORT}/work`, r => r.resume()).on('error', () => {});
    }, 5000);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcg-connectivity-nodejs-apm
  namespace: newrelic
  labels:
    app.kubernetes.io/name: pcg-connectivity-nodejs-apm
    app.kubernetes.io/part-of: pipeline-control-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pcg-connectivity-nodejs-apm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pcg-connectivity-nodejs-apm
    spec:
      containers:
        - name: app
          image: node:22-alpine
          workingDir: /app
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /config/server.js /app/server.js && \
              npm install --no-audit --no-fund newrelic@14.3.4 express@4.22.2 && \
              exec node -r newrelic server.js
          env:
            - name: NEW_RELIC_APP_NAME
              value: "pcg-connectivity-nodejs-apm"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: pcg-connectivity-nodejs-license
                  key: license-key
            - name: NEW_RELIC_NO_CONFIG_FILE
              value: "true"
            - name: NEW_RELIC_LOG
              value: "stdout"
            - name: NEW_RELIC_LOG_LEVEL
              value: "info"
            # Point at the in-cluster gateway Service instead of public New Relic.
            - name: NEW_RELIC_HOST
              value: "pcg-nginx.newrelic.svc.cluster.local"
            # Trust the internal CA that signed the gateway's TLS cert.
            - name: NODE_EXTRA_CA_CERTS
              value: "/certs/ca.crt"
          volumeMounts:
            - name: app-src
              mountPath: /config
              readOnly: true
            - name: app-work
              mountPath: /app
            - name: pcg-ca
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: app-src
          configMap:
            name: pcg-connectivity-nodejs-apm-src
        - name: app-work
          emptyDir: {}
        - name: pcg-ca
          secret:
            secretName: pcg-ca-bundle
